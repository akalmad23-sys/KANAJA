<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANAJA</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f4f8ff;
  color: #172033;
}

.app {
  max-width: 480px;
  min-height: 100vh;
  margin: auto;
  background: white;
}

header {
  background: linear-gradient(135deg, #0d6efd, #084298);
  color: white;
  padding: 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: 2px;
}

.subtitle {
  font-size: 12px;
  opacity: .9;
  margin-top: 4px;
}

nav {
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
}

nav button {
  border: none;
  background: transparent;
  color: white;
  font-size: 13px;
  font-weight: bold;
}

main {
  padding: 15px;
}

.card {
  background: white;
  border: 1px solid #e2e9f5;
  border-radius: 18px;
  padding: 15px;
  margin-bottom: 14px;
  box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

textarea,
input {
  width: 100%;
  border: 1px solid #d9e3f2;
  border-radius: 12px;
  padding: 12px;
  font-size: 15px;
  outline: none;
}

textarea {
  min-height: 90px;
  resize: none;
}

.btn {
  background: #0d6efd;
  color: white;
  border: none;
  border-radius: 12px;
  padding: 11px 16px;
  font-weight: bold;
}

.profile {
  display: flex;
  gap: 12px;
  align-items: center;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: #dbeafe;
  color: #0757c9;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 19px;
}

.username {
  font-weight: bold;
}

.muted {
  color: #778399;
  font-size: 12px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.actions button {
  border: none;
  background: #f0f5fc;
  padding: 9px 12px;
  border-radius: 10px;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

.login {
  min-height: 100vh;
  padding: 45px 22px;
  background: linear-gradient(160deg,#0d6efd,#063b9c);
}

.login-box {
  background: white;
  border-radius: 24px;
  padding: 25px;
  margin-top: 60px;
  box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

.login-logo {
  color: #0d6efd;
  font-size: 32px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 8px;
}

.login-box p {
  color: #778399;
  margin-bottom: 22px;
}

.login-box input {
  margin-bottom: 12px;
}

.warning {
  display: none;
  background: #fff3cd;
  color: #664d03;
  padding: 12px;
  border-radius: 12px;
  margin-top: 10px;
  font-size: 13px;
}

.message {
  padding: 11px 14px;
  background: #edf4ff;
  border-radius: 15px;
  margin: 7px 0;
  width: fit-content;
  max-width: 85%;
}

.my-message {
  background: #0d6efd;
  color: white;
  margin-left: auto;
}

.follow {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.follow button {
  border: none;
  background: #0d6efd;
  color: white;
  padding: 8px 13px;
  border-radius: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="login">

  <div class="login-box">

    <div class="login-logo">KANAJA</div>

    <p>Connect. Share. Express.</p>

    <input
      id="phone"
      type="tel"
      placeholder="Mobile Number"
      maxlength="15">

    <input
      id="password"
      type="password"
      placeholder="6-Digit Password"
      maxlength="6">

    <button
      class="btn"
      style="width:100%;"
      onclick="login()">
      Login / Create Account
    </button>

    <div id="loginWarning" class="warning"></div>

  </div>

</div>


<!-- APP -->

<div id="appScreen" class="app screen">

<header>

  <div class="logo">KANAJA</div>

  <div class="subtitle">
    Connect. Share. Express.
  </div>

  <nav>

    <button onclick="showScreen('home')">
      Home
    </button>

    <button onclick="showScreen('friends')">
      Friends
    </button>

    <button onclick="showScreen('messages')">
      Messages
    </button>

    <button onclick="showScreen('profile')">
      Profile
    </button>

  </nav>

</header>


<main>


<!-- HOME -->

<section id="home" class="screen active">

  <div class="card">

    <textarea
      id="postText"
      placeholder="Write what you think...">
    </textarea>

    <br><br>

    <input
      id="media"
      type="file"
      accept="image/*,video/*">

    <br><br>

    <button
      class="btn"
      onclick="createPost()">
      Post
    </button>

    <div id="postWarning" class="warning"></div>

  </div>

  <div id="posts"></div>

</section>


<!-- FRIENDS -->

<section id="friends" class="screen">

  <div class="card">

    <h3>Find People</h3>

    <br>

    <input
      placeholder="@username">

    <br><br>

    <button class="btn">
      Search
    </button>

  </div>


  <div class="card follow">

    <div class="profile">

      <div class="avatar">
        A
      </div>

      <div>

        <div class="username">
          @example
        </div>

        <div class="muted">
          KANAJA member
        </div>

      </div>

    </div>

    <button>
      Follow
    </button>

  </div>

</section>


<!-- MESSAGES -->

<section id="messages" class="screen">

  <div class="card">

    <h3>Private Messages</h3>

    <p class="muted">
      Messaging is available between mutual friends.
    </p>

  </div>


  <div class="card">

    <div class="message">
      Hello! Welcome to KANAJA.
    </div>

    <div class="message my-message">
      Hello 👋
    </div>

    <br>

    <input
      id="messageText"
      placeholder="Write a message...">

    <br><br>

    <button
      class="btn"
      onclick="sendMessage()">
      Send
    </button>

  </div>

</section>


<!-- PROFILE -->

<section id="profile" class="screen">

  <div class="card">

    <div class="profile">

      <div class="avatar">
        K
      </div>

      <div>

        <div
          id="profileUsername"
          class="username">
          @kanaja_user
        </div>

        <div class="muted">
          One profile description
        </div>

      </div>

    </div>

  </div>


  <div class="card">

    <h3>Profile</h3>

    <br>

    <input
      placeholder="Your description">

    <br><br>

    <button class="btn">
      Save Profile
    </button>

  </div>

</section>


</main>

</div>


<script>

function login() {

  let phone =
    document.getElementById("phone").value.trim();

  let password =
    document.getElementById("password").value.trim();

  let warning =
    document.getElementById("loginWarning");


  if (phone === "") {

    warning.innerText =
      "Please enter your mobile number.";

    warning.style.display = "block";

    return;
  }


  if (!/^[0-9]{6}$/.test(password)) {

    warning.innerText =
      "Password must contain exactly 6 digits.";

    warning.style.display = "block";

    return;
  }


  localStorage.setItem(
    "kanaja_phone",
    phone
  );


  document
    .getElementById("loginScreen")
    .style.display = "none";


  document
    .getElementById("appScreen")
    .classList.add("active");


  document
    .getElementById("profileUsername")
    .innerText = "@kanaja_user";
}


function showScreen(id) {

  document
    .querySelectorAll("main .screen")
    .forEach(function(section) {

      section.classList.remove("active");

    });


  document
    .getElementById(id)
    .classList.add("active");
}


function createPost() {

  let text =
    document.getElementById("postText")
    .value.trim();

  let media =
    document.getElementById("media");

  let warning =
    document.getElementById("postWarning");


  if (text === "" && media.files.length === 0) {

    warning.innerText =
      "Please write something or choose media.";

    warning.style.display = "block";

    return;
  }


  if (
    media.files.length > 0 &&
    /porn|xxx|nsfw|nude/i
      .test(media.files[0].name)
  ) {

    warning.innerText =
      "Warning: This media cannot be published.";

    warning.style.display = "block";

    return;
  }


  warning.style.display = "none";


  let post =
    document.createElement("div");

  post.className = "card";


  post.innerHTML =

    '<div class="profile">' +

      '<div class="avatar">K</div>' +

      '<div>' +

        '<div class="username">' +
          '@kanaja_user' +
        '</div>' +

        '<div class="muted">' +
          'Just now' +
        '</div>' +

      '</div>' +

    '</div>' +

    (text ?
      '<p style="margin-top:12px;">' +
      escapeHTML(text) +
      '</p>' : '') +

    '<div class="actions">' +

      '<button onclick="likePost(this)">' +
      '♡ Like' +
      '</button>' +

      '<button onclick="alert(\'Comment feature coming next.\')">' +
      '💬 Comment' +
      '</button>' +

      '<button onclick="sharePost()">' +
      '↗ Share' +
      '</button>' +

    '</div>';


  if (
    media.files.length > 0 &&
    media.files[0].type.startsWith("image/")
  ) {

    let image =
      document.createElement("img");

    image.style.width = "100%";
    image.style.borderRadius = "14px";
    image.style.marginTop = "12px";

    image.src =
      URL.createObjectURL(media.files[0]);

    post.insertBefore(
      image,
      post.querySelector(".actions")
    );
  }


  document
    .getElementById("posts")
    .prepend(post);


  document
    .getElementById("postText")
    .value = "";

  media.value = "";
}


function likePost(button) {

  if (button.innerText.includes("Liked")) {

    button.innerText = "♡ Like";

  } else {

    button.innerText = "♥ Liked";

  }
}


function sendMessage() {

  let input =
    document.getElementById("messageText");

  let text =
    input.value.trim();


  if (text === "") return;


  let message =
    document.createElement("div");

  message.className =
    "message my-message";

  message.innerText = text;


  input.parentElement.insertBefore(
    message,
    input
  );


  input.value = "";
}


function sharePost() {

  alert(
    "Share feature will be connected to the real app backend."
  );

}


function escapeHTML(text) {

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
